name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # 使用 Java 21
        java: [21]
        # 仅使用 Ubuntu 系统
        os: [ubuntu-22.04]
        # 多版本分支
        branch: [
          multiversion/1.21.7,
          multiversion/1.21.11
        ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }} # 动态检出指定分支

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }} # 仅上传最新 Java 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.branch }} # 按分支命名 artifact
          path: build/libs/
          compression-level: 9
